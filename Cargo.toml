[package]
name = "apple-mail-mcp"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Local CLI and stdio MCP server for Apple Mail"
repository = "https://github.com/smarzola/apple-mail-mcp"
license = "MIT"

[[bin]]
name = "apple-mail"
path = "src/main.rs"

[dependencies]
async-trait = "0.1"
chrono = { version = "0.4", default-features = false }
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rmcp = { version = "2.2", features = ["transport-io"] }
schemars = "1.2"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }

[dev-dependencies]
assert_matches = "1"
rmcp = { version = "2.2", features = ["client"] }
